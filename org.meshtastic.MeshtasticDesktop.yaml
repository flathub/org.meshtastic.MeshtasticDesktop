id: org.meshtastic.MeshtasticDesktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: meshtastic-wrapper.sh

finish-args:
  - --share=ipc
  # Allow the app to communicate with the X server
  - --socket=x11
  # Required for USB Serial support
  - --device=all
  # Needs network access
  - --share=network
  # Allow bluetooth if available
  - --allow=bluetooth
  - --system-talk-name=org.bluez.*
  # Set env for the bundled JBR
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre

modules:
  # Jetbrains Runtime (JBR) JRE must be used for proper window scaling, font rendering, etc.
  - name: jbr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jre
      - tar xzf jbr_jcef-*.tar.gz -C /app/jre --strip-components=1
    sources:
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25.0.4.1-linux-x64-b610.67.tar.gz
        sha512: 4680c1d459208f4017feff141be3d710733bd1225b6f61bc628937141857f00f92734aaea7567effae920c811243de03cfb91acd9b6fc4811897d892ae21fdad
        only-arches:
          - x86_64
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25.0.4.1-linux-aarch64-b610.67.tar.gz
        sha512: d3d8fb6827906393d73ec06fc29a2e4710ac79576849ee12a7c40429249e1cb6cebae219197947e297b01179c0576ab7e6e09f0578c4ba66558a6cbdb44dd2b2
        only-arches:
          - aarch64

  - name: meshtastic-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk25/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
        # Disable Gradle's auto-download and auto-detect of Java installations
        ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-detect: 'false'
        ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: 'false'
        ORG_GRADLE_PROJECT_org.gradle.java.installations.paths: /usr/lib/sdk/openjdk25/jvm/openjdk-25
    build-commands:
      - install -Dm755 meshtastic-wrapper.sh /app/bin/meshtastic-wrapper.sh
      # Install desktop metadata
      - install -Dm644 desktopApp/packaging/icons/icon_round.svg /app/share/icons/hicolor/scalable/apps/org.meshtastic.MeshtasticDesktop.svg
      - install -Dm644 -t /app/share/applications desktopApp/packaging/linux/org.meshtastic.MeshtasticDesktop.desktop
      - desktop-file-edit --set-key="Exec" --set-value="meshtastic-wrapper.sh %U"
        /app/share/applications/org.meshtastic.MeshtasticDesktop.desktop
      - install -Dm644 -t /app/share/metainfo desktopApp/packaging/linux/org.meshtastic.MeshtasticDesktop.metainfo.xml
      # Build!
      - ./gradlew --offline :desktopApp:packageUberJarForCurrentOS
      - >
        JAR_FILE=$(find desktopApp/build/compose/jars/ -name "*.jar" -type f
        | head -1)
        && install -Dm755 "$JAR_FILE" /app/lib/meshtastic-desktop.jar
    sources:
      - type: git
        url: https://github.com/meshtastic/Meshtastic-Android.git
        tag: v2.8.2
        commit: 616592901c0595c1cd1a0184a07e63743c846e55
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/meshtastic/Meshtastic-Android/releases/latest
          timestamp-query: .published_at
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
      - type: file
        url: https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
        sha256: bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
        dest: gradle/wrapper
        dest-filename: gradle-bin.zip
        x-checker-data:
          type: json
          url: https://services.gradle.org/versions/current
          is-main-source: false
          version-query: .version
          url-query: .downloadUrl
      - type: file
        path: gradle-wrapper.properties
        dest: gradle/wrapper
      - flatpak-sources.json
      - type: file
        path: meshtastic-wrapper.sh
      - type: patch
        paths:
          # Remove the toolchainVendor=JETBRAINS line in the Gradle daemon JVM properties
          # as it causes Gradle to fail when building with OpenJDK
          - patches/gradle-remove_JvmVendorSpec.patch
